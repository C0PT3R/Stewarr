<div class="modal-overlay">
  <main class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="add-service-title" tabindex="-1">
    <div class="top">
      <div>
        <h2 id="add-service-title">{{.Title}}</h2>
        <div class="muted" data-service-step-hint>Stewarr checks the connection before showing the rest.</div>
      </div>
    </div>
    <div class="modal-scroll">
      <form data-background-submit-then-overlay="/services/consistency-progress" method="post" action="/services/create">
        <div class="field-stack">
          <label for="service-type">Type<select id="service-type" name="type" required data-service-type>
            {{range .Types}}<option value="{{.Value}}">{{.Label}}</option>{{end}}
          </select></label>
          <p class="muted" data-service-field="jellyfin seerr" hidden>This service only enriches library data (watch history, favorites, requests) — it never owns removable storage, so it has no "Allow automatic removal" option and is never a removal candidate itself.</p>
          <label for="service-name">Name<input id="service-name" name="name" required></label>
          <label for="service-url">URL<input id="service-url" name="url" type="url" required></label>
          <label for="service-api-key" data-service-field="radarr sonarr jellyfin seerr">API key<input id="service-api-key" name="api_key" type="password" autocomplete="off"></label>
          <label for="service-username" data-service-field="qbittorrent" hidden>Username<input id="service-username" name="username" autocomplete="off"></label>
          <label for="service-password" data-service-field="qbittorrent" hidden>Password<input id="service-password" name="password" type="password" autocomplete="off"></label>
          <label class="toggle" data-service-field="radarr sonarr qbittorrent"><input type="checkbox" name="allow_automatic_removal"><span>Allow automatic removal<span class="muted">Lets unattended cleanup remove what this service owns, once automatic removal is enabled in Settings.</span></span></label>
        </div>
        <p data-modal-error hidden class="bad"></p>
        <div class="actions">
          <button type="button" data-overlay-cancel>Cancel</button>
          <button type="button" data-service-test>Test connection</button>
          <button type="submit" data-service-submit hidden>{{.Title}}</button>
        </div>
      </form>
    </div>
  </main>
</div>
