<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Settings · {{appName}}</title>
    {{head}}
  </head>
  <body data-controller="shell revisions">
    {{chrome "settings"}}
    <h1 class="page-title">Settings</h1>
    <div class="card" style="max-width:420px">
      <h2>Change password</h2>
      {{if .Error}}<p class="bad">{{.Error}}</p>{{end}}
      {{if .Success}}<p class="positive">Password updated.</p>{{end}}
      <form method="post" action="/settings/password">
        <div class="field-stack">
          <label for="settings-current">Current password<input id="settings-current" name="current_password" type="password" required autocomplete="current-password"></label>
          <label for="settings-new">New password<input id="settings-new" name="new_password" type="password" required minlength="8" autocomplete="new-password"></label>
          <label for="settings-confirm">Confirm new password<input id="settings-confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password"></label>
        </div>
        <button type="submit">Update password</button>
      </form>
    </div>
  </body>
</html>
