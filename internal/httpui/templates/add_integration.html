<div class="removal-overlay">
  <main class="removal-dialog" role="dialog" aria-modal="true" aria-labelledby="add-integration-title" tabindex="-1">
    <div class="top">
      <div>
        <h2 id="add-integration-title">Add integration</h2>
        <div class="muted">Connarr checks the connection before saving it.</div>
      </div>
    </div>
    <div class="removal-scroll">
      <form data-background-submit method="post" action="/services/integrations">
        <div class="field-stack">
          <label for="integration-type">Type<select id="integration-type" name="type" required>
            <option value="radarr">Radarr</option>
            <option value="sonarr">Sonarr</option>
            <option value="qbittorrent">qBittorrent</option>
            <option value="jellyfin">Jellyfin</option>
            <option value="seerr">Seerr</option>
          </select></label>
          <label for="integration-name">Name<input id="integration-name" name="name" required></label>
          <label for="integration-url">URL<input id="integration-url" name="url" type="url" required></label>
          <label for="integration-api-key">API key<input id="integration-api-key" name="api_key" type="password" autocomplete="off"></label>
          <label for="integration-username">Username<input id="integration-username" name="username" autocomplete="off"></label>
          <label for="integration-password">Password<input id="integration-password" name="password" type="password" autocomplete="off"></label>
        </div>
        <p data-modal-error hidden class="bad"></p>
        <div class="actions">
          <button type="button" data-overlay-cancel>Cancel</button>
          <button type="submit">Add integration</button>
        </div>
      </form>
    </div>
  </main>
</div>
